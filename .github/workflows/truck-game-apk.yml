name: Drizzie Truck - APK Android

on:
  push:
    paths:
      - 'truck-game/**'
      - '.github/workflows/truck-game-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Empacotar o jogo (Three.js + código)
        working-directory: truck-game/web
        run: |
          npm ci
          npm run build

      - name: Compilar APK (debug + release)
        working-directory: truck-game/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Renomear APKs
        run: |
          mkdir -p out
          cp truck-game/android/app/build/outputs/apk/debug/app-debug.apk out/DrizzieTruck-debug.apk
          cp truck-game/android/app/build/outputs/apk/release/app-release.apk out/DrizzieTruck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DrizzieTruck-apk
          path: out/*.apk

      - name: Publicar APK no repositório (pasta apk/)
        if: github.event_name == 'push'
        run: |
          mkdir -p apk
          cp out/DrizzieTruck.apk apk/DrizzieTruck.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/DrizzieTruck.apk
          git commit -m "build: APK do Drizzie Truck [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
