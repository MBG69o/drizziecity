name: Drizzie Truck - APK Android

on:
  push:
    paths:
      - 'truck-game/**'
      - '.github/workflows/truck-game-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Empacotar o jogo (Three.js + código)
        working-directory: truck-game/web
        run: |
          npm ci
          npm run build

      - name: Compilar APK (debug + release)
        working-directory: truck-game/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Renomear APKs
        run: |
          mkdir -p out
          cp truck-game/android/app/build/outputs/apk/debug/app-debug.apk out/DrizzieTruck-debug.apk
          cp truck-game/android/app/build/outputs/apk/release/app-release.apk out/DrizzieTruck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DrizzieTruck-apk
          path: out/*.apk
