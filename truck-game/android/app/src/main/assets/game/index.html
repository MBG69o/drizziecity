<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Drizzie Truck</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading">
  <div class="logo"><span>DRIZZIE</span> TRUCK</div>
  <div class="sub">Rotas &amp; Cargas</div>
  <div class="bar"><i id="loadbar"></i></div>
  <div id="loadmsg">Carregando…</div>
</div>

<!-- ============ MENU PRINCIPAL (sobre a cena 3D) ============ -->
<div id="title" class="hidden">
  <div class="t-card">
    <div class="t-brand"><div class="logo">DRIZZIE <span>TRUCK</span></div><div class="sub">Rotas &amp; Cargas</div></div>
    <div class="t-driver">
      <div class="t-ava">🧑‍✈️</div>
      <div><b id="pname">Motorista</b><small id="plvl"></small></div>
      <button class="t-edit" data-act="rename" title="Mudar nome">✎</button>
    </div>
    <button id="play" class="t-main">▶&nbsp; Pegar a estrada</button>
    <div class="t-grid">
      <button data-act="jobs"><i>📋</i>Fretes</button>
      <button data-act="garage"><i>🚚</i>Concessionária</button>
      <button data-act="map"><i>🗺️</i>Mapa</button>
      <button data-act="settings"><i>⚙️</i>Ajustes</button>
    </div>
    <div class="t-job" id="tjob"></div>
  </div>
  <div class="t-top"><span class="chip-m" id="tmoney">R$ 0</span></div>
  <div class="t-truck">
    <small>SEU CAMINHÃO</small>
    <div id="tiname"></div>
    <div id="tispecs"></div>
    <div class="t-stats" id="tstats"></div>
  </div>
  <div class="ver">v2.3.0</div>
</div>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="mapwrap"><canvas id="minimap" width="300" height="300"></canvas><div id="dist"></div></div>
  <div id="profile"><b id="lvl">Nv 1</b><span id="money">R$ 0</span><div class="xpbar"><i id="xpbar"></i></div></div>

  <div id="jobpanel">
    <div id="jobtitle">Sem frete ativo</div>
    <div id="jobsub">Toque em 📋 para escolher uma carga</div>
  </div>

  <div id="topbtns">
    <button class="rb" data-act="jobs" title="Fretes">📋</button>
    <button class="rb" data-act="camera" title="Câmera"><svg viewBox="0 0 24 24"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="rb" data-act="menu" title="Menu"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18" cy="12" r="1.8" fill="currentColor"/></svg></button>
    <button class="rb" data-act="pause" title="Pausa"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3"/></svg></button>
  </div>

  <!-- volante -->
  <div id="wheelwrap">
    <button id="blinkL" class="arrowb blink" title="Pisca esquerda">◀</button>
    <div id="steerbtns"><button id="left" class="pad steerb">⟲</button><button id="right" class="pad steerb">⟳</button></div>
    <div id="wheel"><svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="5"/>
      <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
      <path d="M30 95 Q100 60 170 95 L160 112 Q100 88 40 112Z" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
      <path d="M78 130 Q100 175 122 130" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
      <rect x="72" y="88" width="56" height="40" rx="12" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
      <path d="M86 104h20l8-6v20l-8-6H86z" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"/>
      <rect x="96" y="12" width="8" height="14" rx="2" fill="#c8102e"/>
    </svg></div>
    <button id="blinkR" class="arrowb blink" title="Pisca direita">▶</button>
  </div>
  <button id="lightsbtn" class="rb small2" title="Faróis"><svg viewBox="0 0 24 24"><path d="M10 6c-4 0-6 3-6 6s2 6 6 6c2 0 3-2 3-6s-1-6-3-6zM15 8h6M15 12h6M15 16h6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>

  <!-- câmbio e pedais -->
  <div id="gearsel"><button data-g="D">D</button><button data-g="N">N</button><button data-g="R">R</button></div>
  <div id="pedals">
    <button id="brake" class="pad pedal brake"><i></i></button>
    <button id="gas" class="pad pedal gas"><i></i></button>
  </div>
  <button id="enginebtn" class="hidden"><span>Ligar<br>Motor</span><i></i></button>

  <!-- painel inferior -->
  <div id="dashbar">
    <canvas id="spdg" width="280" height="280"></canvas>
    <div id="icons">
      <span id="ic-bl" class="bl">◀</span>
      <span id="ic-light" title="Faróis">◐</span>
      <button id="ic-haz" title="Pisca-alerta">⚠</button>
      <button id="ic-hand" title="Freio de mão">(P)</button>
      <span id="ic-dmg" title="Avaria">⚠ <b id="dmg">0%</b></span>
      <span id="ic-load"></span>
      <span id="ic-br" class="bl">▶</span>
    </div>
    <canvas id="rpmg" width="280" height="280"></canvas>
  </div>

  <div id="progress" class="hidden"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" class="bg"/><circle cx="50" cy="50" r="42" id="progarc"/></svg><span id="progtext">Carregando</span></div>
  <div id="toast"></div>
  <div id="fps" class="hidden"></div>
</div>

<!-- ============ MENUS ============ -->
<div id="modal" class="hidden">
  <div class="sheet">
    <div class="tabs">
      <button data-tab="jobs">Fretes</button>
      <button data-tab="garage">Garagem</button>
      <button data-tab="profile">Perfil</button>
      <button data-tab="settings">Ajustes</button>
      <button class="close" data-act="close">✕</button>
    </div>
    <div id="tabbody"></div>
  </div>
</div>

<div id="popup" class="hidden"><div class="card pop" id="popcard"></div></div>
<div id="bigmap" class="hidden"><canvas id="bigmapc"></canvas><button class="rb close2" data-act="closemap">✕</button></div>

<script src="game.js"></script>
</body>
</html>
